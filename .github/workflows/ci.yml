name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yws
          POSTGRES_PASSWORD: yws
          POSTGRES_DB: yws
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yws"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://yws:yws@localhost:5432/yws
      DATABASE_URL_TEST: postgres://yws:yws@localhost:5432/yws_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create test database
        run: PGPASSWORD=yws psql -h localhost -U yws -d yws -c 'create database yws_test'
      - run: npm ci
      - run: npm run check
